[package]
name = "opendm40"
version = "0.4.0"
edition = "2021"
description = "Replacement firmware for the Alientek DM40 (GD32F427)"

[[bin]]
name = "opendm40"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"

[features]
default = ["vdisk", "ad2-isr"]
# Leave the panel contents alone at start (no clear, status squares only on
# failure) so a screenshot captures what the previous firmware last drew.
keep-screen = []
# AD2 logger stream on ONE timer interrupt (TIMER6 = STM32 TIM7, IRQ 55) with
# the HY3131 bus handed to the ISR exclusively while an AD2 session runs
# (../docs/history/decisions-2026-10-22.md #3; src/hy3131.rs `stream`, src/logger.rs
# `isr`, src/ad2pll.rs). DEFAULT since the device check of 4b98128 (lost 0 at
# 4800 / 9600 / 19200 S/s, 60 s each; docs/dmm-input-scope-feasibility.md 11).
# Without it (--no-default-features --features vdisk) the build has no
# interrupt at all and the AD2 logger is the main-loop sampler.
ad2-isr = []
# USB mass-storage LUN = the read-only information volume generated from the
# MCU memory and the SPI-disk files (src/vdisk.rs: LOGS / SCOPE / SHOTS /
# INFO / DEBUG). Default; without it the LUN is the writable SPI disk.
vdisk = []
# fatren (src/fatren.rs: after a boot, rename the installed dm40*.bin on the
# SPI FAT to _DM40PRV.BIN; its exact condition is owned by fatren.rs) only
# reports what it would do.
fatren-dry-run = []
# Recovery alternatives for tests (default recovery = zero the 12-byte loader
# marker at 0x08008000 + reset -> vendor loader update screen + USB disk):
#   recovery-file: 0-byte DM40RCVR.BIN on the SPI FAT + power off (needs a cold
#     boot with the key held long enough to reach the loader);
#   recovery-usb: our own minimal USB mass-storage disk (no LCD).
recovery-file = []
recovery-usb = []
# The AD2 device experiments DBG:AD2:TORN? / NOISE? / DCV? / N7? (src/ad2exp.rs;
# tools/dm40scpi.py `ad2 torn` / `ad2 noise`, tools/experiments/ad2dcv.py).
# Not default on test/scope-chain-0.4: region B had no room for them next to
# the protocol decoder (docs/native-boot.md "Region B audit #7"). Build with
# --features ad2-exp for an experiment session.
ad2-exp = []
# DBG:SRC, the ohm-source map row (src/dbgsrc.rs, tools/srcmap.py). Not
# default on test/scope-chain-0.4 for the same reason.
dbg-src = []
# The decoder's frame log (Mode Log, DECode:MODE LOG, View::Decode;
# src/app_log.rs). Not default on test/scope-chain-0.4: region B has no room
# for it next to 0.4.0's GEN / CH2 channels; without it Mode Log is refused
# and the band decode is unchanged.
dec-log = []
# Modbus RTU in the protocol decoder (src/decode.rs `MODBUS`). Not default on
# test/scope-chain-0.4 for the same reason; without it the decoder is UART
# only (DECode:PROTocol MODBus is refused).
dec-modbus = []
# DBG:HYSPI:SELF? / WR?, the HY3131 bus self-test and write experiment
# (src/hyspi.rs; emu/hy3131/ad2streamtest.py). Off by default: ~2.3 KB of
# region C (docs/native-boot.md "Region B audit #9"); without it the two
# queries are refused (undefined header).
dbg-hyspi = []
# DBG:ACDC?, the AC+DC phase diagnostic text (Dmm::acdc_diag_text). Off by
# default for the same reason (~0.8 KB of region C); refused without it.
dbg-acdc = []
# DBG:TOUCH? / DBG:TOUCH 0, the 160-entry touch log (src/touch.rs; 1.9 KB of
# RAM). Off by default: without it the log keeps 16 entries, enough for the
# touch test page (Settings > Touch test, read every pass), and the two
# commands are refused (undefined header). Build with --features dbg-touch
# for a touch session (docs/native-boot.md "SRAM audit").
dbg-touch = []
# DBG:PROF? / DBG:PROF:RESET, the main-loop profiler (src/prof.rs; 1 KB of
# RAM and its hooks in every pass). Off by default: the hooks are empty and
# the two commands are refused (undefined header).
dbg-prof = []
# More debug replies, each off by default (refused as an undefined header
# without its feature; docs/native-boot.md "Region C audit #4"):
# DBG:DIAG? (main.rs touch_diag: touch / loop / charge counters).
dbg-diag = []
# DBG:OHM6 / DBG:OHM6? (the 600 Mohm range's tuning, Dmm::ohm600_dbg).
dbg-ohm6 = []
# DBG:SENTinel? / DBG:SENTinel:REG? (Sentinel::diag_text, Dmm::reg_text).
dbg-sent = []
# DBG:SRC: dbg-src above.
# DBG:ACDC:METH / STAT / ZERO / R0, the AC+DC prototype methods B and C
# (src/acdcm.rs; docs/acdc-approaches.md; ~6.6 KB of region B, 2.7 KB of
# region C, 480 B of RAM). Off by default: AC+DC is method A (the stock
# alternation, dmm.rs) only and the four commands are refused (undefined
# header).
acdc-meth = []
# DBG:ACDC:TRACE, the AC+DC event trace (src/acdctr.rs; a 64-entry ring,
# 1.8 KB of RAM). Off by default: the trace never records and the command is
# refused (undefined header).
acdc-trace = []
# Test builds next to a sleeping owner: the buzzer never sounds (every beep,
# the danger alarm and the power-off warning at duty 0; the continuity / diode
# beeper's CMP pin buffer, HY3131 R20 bit 2, off; the boot key-hold cue
# silent). Not for releases.
mute = []

[dependencies]
cortex-m = "0.7.7"
# critical_section::with (synopsys-usb-otg's endpoint buffers) WITHOUT masking
# interrupts: src/main.rs `NoMask` (the AD2 stream ISR shares no state with it).
critical-section = "1.2.0"
synopsys-usb-otg = { version = "0.5.0", features = ["fs"] }
usb-device = "0.3.2"
usbd-storage = { version = "3.0.0", features = ["bbb", "scsi"] }

# usbd-storage 3.0.0 with five fixes (vendor/usbd-storage, each marked
# "dm40 patch"; device check f3aea2f 6b: a host's reset recovery ended in a
# panic -> watchdog reset): no SCSI callback in Command Transfer Invalid (the
# previous command's pass / fail panicked in `set_status`), the IO buffer
# cleared at every reset, Bulk-Only Mass Storage Reset handled (a control
# OUT; the crate looked for it in control IN), never more IN data than the
# host asked for, `Scsi::sending` (msc.rs pumps the fill / CSW).
[patch.crates-io]
usbd-storage = { path = "vendor/usbd-storage" }
